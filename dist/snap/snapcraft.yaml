name: vvva-cli
base: core24
version: 'v2.6.0'
summary: Secure-by-default JavaScript and TypeScript runtime.
description: |
  3va is a JavaScript and TypeScript runtime built on V8 with
  capability-based sandboxing, post-quantum cryptography (ML-KEM / ML-DSA),
  and WebAssembly support.

  Every permission — filesystem, network, environment variables, subprocess
  execution — is denied by default and must be explicitly granted per script.
  Post-install scripts are blocked unconditionally.
  Built-in process supervisor; no pm2 required. MIT licensed.
title: vvva-cli
license: MIT
contact: https://github.com/OdinoCano/3va/issues
issues: https://github.com/OdinoCano/3va/issues
source-code: https://github.com/OdinoCano/3va
website: https://github.com/OdinoCano/3va

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

# Strict confinement mirrors 3va's deny-by-default philosophy at the
# distribution layer.  Scripts that need real filesystem or network access
# must use 3va's own permission flags; the snap does not pre-grant anything
# beyond what the runtime itself requires to execute.
apps:
  3va:
    command: bin/3va
    plugs:
      - home
      - network
      - network-bind

parts:
  3va:
    # A `dump` part sourced from a relative host path (../../target/release/)
    # looks tempting for a monorepo like this one, but snapcraft's real
    # builds (LXD/Multipass/CI, i.e. anything but a bare `--destructive-mode`
    # run from exactly this directory with a pre-built binary already
    # sitting there) only mount this part's own source tree — a path
    # escaping it via `..` doesn't exist inside the build instance at all.
    # Building from the real git source, like any other snap, works
    # everywhere the same way instead.
    plugin: nil
    source: https://github.com/OdinoCano/3va.git
    source-tag: "$SNAPCRAFT_PROJECT_VERSION"
    build-snaps:
      - rustup
    override-build: |
      rustup default stable
      cargo build --release -p vvva_cli
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      cp target/release/3va "$CRAFT_PART_INSTALL/bin/3va"
