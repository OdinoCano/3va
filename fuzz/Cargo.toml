[package]
name = "vvva_bundler-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.vvva_bundler]
path = "../crates/bundler"

[dependencies.vvva_permissions]
path = "../crates/permissions"

[dependencies.vvva_pm]
path = "../crates/pm"

[dependencies.vvva_js]
path = "../crates/js"

# The HTTP target drives the real async `parse_request`; the current-thread
# runtime only needs timers and buffered reads over an in-memory slice.
[dependencies.tokio]
version = "1"
features = ["rt", "time", "io-util"]

[dependencies.serde_json]
version = "1"

[dependencies.tempfile]
version = "3"

# Initial seed corpora for the targets added by the 2026-10 audit live in
# `fuzz/seeds/<target>/` (tracked), because the default `fuzz/corpus/` is
# gitignored. Use them with:
#     cargo fuzz run --target x86_64-unknown-linux-gnu <target> fuzz/seeds/<target>

# The fuzz crate is its own workspace (required by cargo-fuzz), so it does
# not inherit [patch.crates-io] from the root Cargo.toml. Re-declare the
# same patches so the dependency graph here matches the one the root uses:
#
# - inferno + quick-xml: mirror the root patches so RUSTSEC-2026-0195
#   stays fixed in the fuzz tree too (the denial would re-surface
#   otherwise because fuzz has its own Cargo.lock).
[patch.crates-io]
inferno   = { path = "../vendor/inferno" }
quick-xml = { path = "../vendor/quick-xml" }

[[bin]]
name = "fuzz_target_1"
path = "fuzz_targets/fuzz_target_1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_permission_sandbox"
path = "fuzz_targets/fuzz_permission_sandbox.rs"
test = false
