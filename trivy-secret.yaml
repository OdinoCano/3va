# Trivy secret-scanner configuration (pass with --secret-config or keep at the repo root).
#
# crates/pm/src/secrets.rs is 3va's own secret scanner; its tests use an obviously
# fake GitHub token as sample input. Allow exactly that literal, not the file, so a
# real token anywhere (including in that file) is still reported.
#
# The final character is written as a one-element class on purpose: the pattern
# still matches the fake token, but this file itself no longer looks like a
# `ghp_` token to gitleaks, so no gitleaks allowlist entry is needed for it.
allow-rules:
  - id: fake-github-token-in-pm-secrets-tests
    description: Sample input for the secret scanner's tests (crates/pm/src/secrets.rs)
    regex: ghp_abcdefghijklmnopqrstuvwxyz012345678[9]
