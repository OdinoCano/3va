[package]
name = "vvva_pm"
version = "2.9.0"
edition = "2024"
license = "MIT"
description = "Content-addressable package manager for the 3va runtime — npm-compatible resolver, virtual store, lockfile, OSV audit"
repository = "https://github.com/OdinoCano/3va"
homepage = "https://github.com/OdinoCano/3va"
keywords = ["package-manager", "npm", "lockfile", "audit", "3va"]
categories = ["development-tools"]

[features]
# Route package hashing, provenance signature checks and registry TLS through
# the AWS-LC FIPS 140-3 module. See docs/10-security/10-fips.md.
fips = [
    "dep:aws-lc-rs", "aws-lc-rs/fips",
    "dep:rustls", "rustls/fips", "dep:rustls-native-certs",
    "reqwest/rustls-tls-manual-roots-no-provider",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
vvva_permissions = { version = "2.9.0", path = "../permissions" }
reqwest = { version = "0.12", features = ["json", "gzip"] }
sha2.workspace = true
base64.workspace = true
# Sigstore provenance verification (item: npm provenance) — ECDSA P-256/P-384
# over DSSE PAE. p256/p384 already in the workspace tree; ecdsa is their shared
# signing/verifying trait crate (same version p256 0.13 uses).
p256.workspace = true
p384.workspace = true
ecdsa = "0.16"
# `fips` feature only: AWS-LC FIPS module for hashing, signatures and TLS.
aws-lc-rs = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
hex = "0.4"
regex = "1.12"
flate2 = "1.0"
tar = "0.4"
oxc_allocator = "0.132"
oxc_parser = "0.132"
oxc_ast = "0.132"
oxc_ast_visit = "0.132"
oxc_span = "0.132"

[dev-dependencies]
tempfile.workspace = true
