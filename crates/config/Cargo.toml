[package]
name = "vvva_config"
version = "2.12.0"
rust-version.workspace = true
edition = "2021"
license = "MIT"
description = "Project configuration schema and loader for the 3va JavaScript runtime (3va.config.toml / .json)"
repository = "https://github.com/OdinoCano/3va"
homepage = "https://github.com/OdinoCano/3va"
keywords = ["config", "runtime", "javascript", "3va"]
categories = ["config"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
regex-lite = "0.1"

[dev-dependencies]
tempfile = { workspace = true }
vvva_firewall = { version = "2.12.0", path = "../firewall" }
