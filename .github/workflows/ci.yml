name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel previous runs for the same PR/branch to avoid wasted compute.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs get a read-only token unless they ask for more.
permissions:
  contents: read

jobs:
  # ── Gate 1: formatting ───────────────────────────────────────────────────────
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # ── Gate 2: lints ────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  # ── Gate 3: test suite ───────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-cache prunes target/debug/gn_out, where the v8 build script puts
      # librusty_v8.a, but keeps that script's cached output. On a partial cache
      # hit (any Cargo.toml/Cargo.lock change) the relink then fails with
      # "could not find native static library rusty_v8". Re-run the script.
      - run: test -f target/debug/gn_out/obj/librusty_v8.a || cargo clean -p v8
      - run: cargo test

  # ── Gate 4: dependency security & license audit ──────────────────────────────
  deny:
    name: cargo-deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # FIPS 140-3 build: all crypto/TLS on the AWS-LC FIPS module (docs/10-security/10-fips.md).
  fips:
    name: FIPS build + crypto/TLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: cargo clippy -p vvva_js -p vvva_pm -p vvva_cli --all-targets --features fips -- -D warnings
      - run: cargo test -p vvva_pm --features fips
      - run: >
          cargo test -p vvva_js --features fips
          --test crypto_module --test pq_tls --test websocket_module --test fetch_response_cap
          --test ftp_module --test imap_module --test irc_module --test mqtt_module --test pop3_module
          --test lat_crypto --test lat_fetch --test lat_ftp --test lat_http --test lat_irc
          --test lat_mqtt --test lat_pop3 --test lat_tcp --test lat_tls

  # New or bumped crates must be audited or explicitly exempted (supply-chain/).
  vet:
    name: cargo-vet (supply-chain audits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          # Pinned: supply-chain/imports.lock is written by 0.10.2, which 0.10.0 can't parse.
          tool: cargo-vet@0.10.2
      - run: cargo vet --locked

  # ── Gate 5: fuzz build + short smoke run ─────────────────────────────────────
  fuzz:
    name: Fuzz (build + 30s smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # ASAN requires the GNU (glibc) target; musl uses static libc which
          # is incompatible with sanitizers.
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Build fuzz targets
        run: cargo fuzz build --target x86_64-unknown-linux-gnu
        working-directory: fuzz
      - name: Smoke-run fuzz_target_1 (30 s)
        run: cargo fuzz run fuzz_target_1 --target x86_64-unknown-linux-gnu -- -max_total_time=30
        working-directory: fuzz
      - name: Smoke-run fuzz_permission_sandbox (30 s)
        run: cargo fuzz run fuzz_permission_sandbox --target x86_64-unknown-linux-gnu -- -max_total_time=30
        working-directory: fuzz
      - name: Smoke-run fuzz_pm_resolver (30 s)
        run: cargo fuzz run fuzz_pm_resolver --target x86_64-unknown-linux-gnu -- -max_total_time=30
        working-directory: fuzz

  # ── Gate 6: secret scanning ──────────────────────────────────────────────────
  secrets:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Gate 7: DCO sign-off ─────────────────────────────────────────────────────
  # Every commit in a PR must carry "Signed-off-by:" (git commit -s), the
  # contributor's assertion of the Developer Certificate of Origin
  # (https://developercertificate.org). See CONTRIBUTING.md.
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' \
              || { echo "::error::commit $c has no Signed-off-by (use git commit -s)"; missing=1; }
          done
          exit $missing

  # ── Coverage (report only, does not block) ───────────────────────────────────
  coverage:
    name: Coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Same rust-cache / librusty_v8.a issue as the test job, in llvm-cov's target dir.
      - run: |
          test -f target/llvm-cov-target/debug/gn_out/obj/librusty_v8.a \
            || CARGO_TARGET_DIR=target/llvm-cov-target cargo clean -p v8
      - name: Measure line and branch coverage
        run: |
          cargo llvm-cov --workspace --summary-only | tee coverage.txt
          { echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
