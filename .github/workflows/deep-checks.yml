name: Deep checks

# Checks that are too slow or too specialised for every PR:
#  - test262 regression gate: the `#[ignore]`d `vvva_test` test asserts the
#    failure baselines (language/built-ins, module-code, intl402). Benchmark
#    already reports the pass *rate* weekly; this fails when it regresses.
#  - napi under AddressSanitizer: the ordinary napi tests must be clean, and a
#    canary (the hostile-addon overflow probe) must still trip ASan — if it does
#    not, the sanitizer is not actually instrumenting and "clean" means nothing.

on:
  schedule:
    - cron: "23 5 * * 1" # weekly, Monday 05:23 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    # napi is the largest unsafe surface; check it whenever it changes.
    paths:
      - "crates/js/src/builtins/napi.rs"
      - "crates/js/tests/napi_sanitizers.rs"
      - "crates/js/tests/fixtures/**"
      - ".github/workflows/deep-checks.yml"

# Least privilege: jobs get a read-only token unless they ask for more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: deep-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test262:
    name: test262 regression gate
    # Not on PRs: ~53k tests. Runs on the weekly schedule and on demand.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The commit is pinned in the script, so the baselines stay comparable.
      - name: Fetch test262
        run: bash scripts/setup-test262.sh
      - name: Run the conformance gate
        env:
          # The baseline is only valid in UTC (the Date tests depend on the local
          # time zone); the test refuses to run otherwise.
          TZ: UTC
          # Full list of failures (the test prints only the first 50 per suite).
          TEST262_FAILURES_OUT: ${{ github.workspace }}/test262-failures.txt
        run: cargo test --release -p vvva_test --test test262 -- --ignored --nocapture
      # Also on failure: the list is what you diff against another run.
      - name: Upload the failure list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-failures
          path: test262-failures.txt
          if-no-files-found: ignore

  node-tests:
    name: node test/parallel compatibility
    # Not on PRs: ~1.6k of Node's own tests, and some are slow. Weekly + on demand.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The tag is pinned in the script, so the baseline stays comparable.
      - name: Fetch the nodejs/node test suite
        run: bash scripts/setup-node-tests.sh
      # Same rust-cache / librusty_v8.a issue as the other jobs.
      - run: test -f target/debug/gn_out/obj/librusty_v8.a || cargo clean -p v8
      - name: Build the 3va binary
        run: cargo build --bin 3va
      # Ratchet: fails if a test not in the baseline fails, or if one in the
      # baseline starts passing (then the baseline must be lowered).
      - name: Run the compatibility suite
        env:
          THREEVA_BIN: ${{ github.workspace }}/target/debug/3va
          # The GitHub runners have 4 cores: the suite runs that many test
          # files at the same time.
          NODE_TESTS_JOBS: 4
          # Full lists, for diffing a regression against the baseline.
          NODE_TESTS_FAILURES_OUT: ${{ github.workspace }}/node-tests-failures.txt
          NODE_TESTS_SKIPPED_OUT: ${{ github.workspace }}/node-tests-skipped.txt
          NODE_TESTS_COUNTS_OUT: ${{ github.workspace }}/node-tests-counts.tsv
        run: cargo test -p vvva_test --test node_tests -- --ignored --nocapture
      - name: Generate the compatibility table
        if: always()
        run: bash scripts/compat-table.sh node-tests-counts.tsv --title > node-tests-table.md || true
      # Also on failure: the list is what you diff against another run.
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-tests
          path: |
            node-tests-failures.txt
            node-tests-skipped.txt
            node-tests-counts.tsv
            node-tests-table.md
          if-no-files-found: ignore

  library-suites:
    name: Library test suites (reference)
    # Reference, not a gate: the real suites of express/axios/pg/… run with 3va.
    # Most fail today; the artifact is the baseline to measure the threshold for
    # turning this into a gate (docs/09-testing/07-compatibilidad-node.md §7.4).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24.17.0"
      - run: test -f target/debug/gn_out/obj/librusty_v8.a || cargo clean -p v8
      - run: cargo build --bin 3va
      - name: Run the library suites
        env:
          THREEVA_BIN: ${{ github.workspace }}/target/debug/3va
        # `|| true`: this is a measurement, and every suite failing is expected
        # today. The results file is the artifact, not the exit code.
        run: bash scripts/library-suites.sh || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-suites
          path: tests/library-suites/results.txt
          if-no-files-found: ignore

  napi-asan:
    name: napi under AddressSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # ASan needs the glibc target; musl's static libc is incompatible.
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # -rdynamic: addons resolve their napi_* symbols against the host binary.
      # LSan is on: every `napi_wrap` finalizer and per-function bridge is
      # released now (see tests/napi_handles.rs); only the vendored `v8` crate's
      # own per-isolate bookkeeping is suppressed, in .github/lsan-v8.supp.
      - name: napi tests must be ASan- and LSan-clean
        env:
          RUSTFLAGS: "-Zsanitizer=address -C link-args=-rdynamic"
          LSAN_OPTIONS: "suppressions=${{ github.workspace }}/.github/lsan-v8.supp"
        run: cargo test -p vvva_js --test napi_sanitizers --test napi_handles --target x86_64-unknown-linux-gnu
      # Canary: the probe passes a length far beyond the addon's buffer. ASan
      # must abort it with heap-buffer-overflow; a pass or any other failure
      # means the sanitizer is not doing its job.
      - name: ASan canary must trip
        env:
          RUSTFLAGS: "-Zsanitizer=address -C link-args=-rdynamic"
          LSAN_OPTIONS: "suppressions=${{ github.workspace }}/.github/lsan-v8.supp"
        run: |
          set +e
          cargo test -p vvva_js --test napi_sanitizers --target x86_64-unknown-linux-gnu \
            -- --ignored --nocapture > canary.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ] || ! grep -q 'heap-buffer-overflow' canary.log; then
            echo "::error::ASan canary did not report heap-buffer-overflow (exit $status)"
            tail -40 canary.log
            exit 1
          fi
          echo "canary tripped as expected"
