[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-args=-rdynamic"]

# mimalloc commits whole arenas up front by default on Linux; 3va then showed
# ~10 MB of resident Rust heap before running anything. With lazy commit the
# HTTP benchmark's peak RSS drops 86 -> 74 MB (Express ~117 -> ~99 MB) at the
# same throughput. A -D only mimalloc's sources read; an externally set
# CFLAGS takes precedence (this entry is not forced).
[env]
CFLAGS = "-DMI_DEFAULT_ARENA_EAGER_COMMIT=0"
