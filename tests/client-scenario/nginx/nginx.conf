# Reverse proxy in front of the app. /ip pins X-Forwarded-For to a fixed
# address so the test can prove 3va resolves it through `trustedProxies`.
events {}

http {
  server {
    listen 80;
    client_max_body_size 32m;

    location = /ip {
      proxy_pass http://app:8080/ip;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For 203.0.113.7;
    }

    location / {
      proxy_pass http://app:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
